name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Validate skills against spec and manifest
        run: python3 scripts/validate-skills.py

      - name: Spec-validate published skills (skills-ref)
        run: |
          for d in skills/*/; do
            uvx --from skills-ref agentskills validate "${d%/}"
          done

      - name: Run per-skill deterministic tests
        run: |
          for t in skills/*/tests/*.py; do
            [ -e "$t" ] || continue
            echo "== $t"
            python3 "$t"
          done
